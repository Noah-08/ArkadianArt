<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkadian Art</title>

<style>

/* =========================================================
   🎛️ BASE SETTINGS
========================================================= */

:root{
    --zoom-start: 1.4;
    --zoom-top: 2.05;
    --zoom-button: 1.95;

    --pan-start: 0px;
    --pan-top: 40px;     /* reduced */
    --pan-button: -120px; /* reduced */

    --hold-start: 1.5s;
    --to-top: 3s;
    --to-button: 2.5s;

    --vh: 1vh;
}

/* ========================================================= */

html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    height:100%;
    background:black;
    font-family:Arial, Helvetica, sans-serif;
}

/* FIX iPhone viewport */
body{
    position:relative;
    height: calc(var(--vh) * 100);
}

/* BACKGROUND */
.bg-blur{
    position:fixed;
    inset:0;
    background-image:url("Images/A LANDING CONT.../Landing.jpg");
    background-size:cover;
    background-position:center;
    filter:blur(40px) brightness(1);
    transform:scale(1.2);
    z-index:-1;
}

/* =========================================================
   STAGE (NO FLEX, NO SHIFTING)
========================================================= */

.container{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   CAMERA LAYER (THE ONLY THING THAT MOVES)
========================================================= */

.viewport{
    position:absolute;
    inset:0;
    transform-origin:center center;

    animation: cameraMove calc(var(--hold-start) + var(--to-top) + var(--to-button))
               ease-in-out forwards;
}

/* =========================================================
   IMAGE (NO HORIZONTAL TRANSFORM ANYMORE)
========================================================= */

.main-image{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

/* =========================================================
   CONTINUE BUTTON
========================================================= */

.continue-hitbox{
    position:absolute;
    top:78%;
    left:50%;
    transform:translate(-50%, -50%);

    width:clamp(60px, 6vw, 140px);
    height:clamp(60px, 6vw, 140px);

    cursor:not-allowed;
    z-index:5;

    background:transparent;
    border:none;
    opacity:0;

    pointer-events:none;
    transition:opacity 0.6s ease;

    -webkit-tap-highlight-color: transparent;
}

.continue-hitbox.enabled{
    pointer-events:auto;
    cursor:pointer;
    opacity:1;
}

/* =========================================================
   🎬 CAMERA ANIMATION (STABILISED)
========================================================= */

@keyframes cameraMove {

    0% {
        transform: scale(var(--zoom-start)) translateY(var(--pan-start));
    }

    15% {
        transform: scale(var(--zoom-start)) translateY(var(--pan-start));
    }

    55% {
        transform: scale(var(--zoom-top)) translateY(var(--pan-top));
    }

    100% {
        transform: scale(var(--zoom-button)) translateY(var(--pan-button));
    }
}

</style>
</head>

<body>

<div class="bg-blur"></div>

<div class="container">

    <div class="viewport">

        <img class="main-image" src="Images/A LANDING CONT.../Landing.jpg" alt="Landing">

        <a href="ArkadianArt.html" class="continue-hitbox"></a>

    </div>

</div>

<script>

/* FIX iPHONE VH BUG */
function setVH(){
    document.documentElement.style.setProperty(
        '--vh',
        `${window.innerHeight * 0.01}px`
    );
}
setVH();
window.addEventListener('resize', setVH);

/* UNLOCK BUTTON AFTER ANIMATION */
const viewport = document.querySelector(".viewport");
const button = document.querySelector(".continue-hitbox");

viewport.addEventListener("animationend", () => {
    button.classList.add("enabled");
});

</script>

</body>
</html>
