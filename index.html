<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkadian Art</title>

<style>

/* =========================================================
   🎛️ BASE SETTINGS
========================================================= */

:root{
    --zoom-start: 1.4;
    --zoom-top: 2.1;
    --zoom-button: 2;

    --pan-start: 0px;
    --pan-top: 70px;
    --pan-button: -180px;

    --hold-start: 1.5s;
    --to-top: 3s;
    --to-button: 2.5s;

    /* FIX: real viewport unit for iPhone Safari */
    --vh: 1vh;
}

/* ========================================================= */

html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:black;
    height:100%;
}

/* ❗ IMPORTANT: remove Safari vh bug */
body{
    position:relative;
    height: calc(var(--vh) * 100);
}

/* Background blur */
.bg-blur{
    position:fixed;
    inset:0;
    background-image:url("Images/A LANDING CONT.../Landing.jpg");
    background-size:cover;
    background-position:center;
    filter:blur(40px) brightness(1);
    transform:scale(1.2);
    z-index:-1;
}

/* =========================================================
   CONTAINER (NO FLEX — prevents vertical shifting)
========================================================= */

.container{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   CAMERA WRAPPER
========================================================= */

.viewport{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    transform-origin:center center;

    animation: cameraMove calc(var(--hold-start) + var(--to-top) + var(--to-button))
               ease-in-out forwards;
}

/* MAIN IMAGE */
.main-image{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    height:100%;
    width:auto;
    object-fit:contain;
    display:block;
}

/* =========================================================
   CONTINUE BUTTON
========================================================= */

.continue-hitbox{
    position:absolute;
    top:78%;
    left:50%;
    transform:translate(-50%, -50%);
    width:clamp(60px, 6vw, 140px);
    height:clamp(60px, 6vw, 140px);

    cursor:not-allowed;
    z-index:5;

    background:transparent;
    border:none;
    opacity:0;

    pointer-events:none;
    transition:opacity 0.6s ease;

    -webkit-tap-highlight-color: transparent;
}

.continue-hitbox.enabled{
    pointer-events:auto;
    cursor:pointer;
    opacity:1;
}

/* =========================================================
   🎬 CAMERA ANIMATION (FIXED SCALE LAYER)
========================================================= */

@keyframes cameraMove {

    0% {
        transform: scale(var(--zoom-start)) translateY(var(--pan-start));
    }

    15% {
        transform: scale(var(--zoom-start)) translateY(var(--pan-start));
    }

    55% {
        transform: scale(var(--zoom-top)) translateY(var(--pan-top));
    }

    100% {
        transform: scale(var(--zoom-button)) translateY(var(--pan-button));
    }
}

/* =========================================================
   MOBILE FIX SCRIPT SUPPORT
========================================================= */

</style>

</head>

<body>

<div class="bg-blur"></div>

<div class="container">

    <div class="viewport">

        <img class="main-image" src="Images/A LANDING CONT.../Landing.jpg" alt="Landing Page">

        <a href="ArkadianArt.html" class="continue-hitbox"></a>

    </div>

</div>

<script>

/* =========================================================
   FIX iPHONE VH BUG PROPERLY
========================================================= */

function setVH(){
    document.documentElement.style.setProperty(
        '--vh',
        `${window.innerHeight * 0.01}px`
    );
}

setVH();
window.addEventListener('resize', setVH);

/* =========================================================
   UNLOCK BUTTON AFTER ANIMATION FINISHES
========================================================= */

const viewport = document.querySelector(".viewport");
const button = document.querySelector(".continue-hitbox");

viewport.addEventListener("animationend", () => {
    button.classList.add("enabled");
});

</script>

</body>
</html>
