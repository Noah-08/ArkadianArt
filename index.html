<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkadian Art</title>

<style>

/* =========================================================
   CAMERA POSITIONS
   EDIT THESE ONLY
========================================================= */

:root{

    /* FRAME 1 (FULL VIEW) */
    --f1-scale: 1;
    --f1-x: 0px;
    --f1-y: 0px;

    /* FRAME 2 (TOP ARTWORK) */
    --f2-scale: 2.1;
    --f2-x: 0px;
    --f2-y: 350px;

    /* FRAME 3 (ENTER BUTTON) */
    --f3-scale: 4.5;
    --f3-x: 25px;
    --f3-y: -1000px;

}

/* ========================================================= */

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    position:relative;
}

/* =========================================================
   BACKGROUND BLUR
========================================================= */

.bg-blur{
    position:fixed;
    inset:0;

    background-image:url("Images/A LANDING CONT.../Landing.png");
    background-size:cover;
    background-position:center;

    filter:blur(40px);
    transform:scale(1.2);

    z-index:-1;
}

/* =========================================================
   STAGE
========================================================= */

.container{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   CAMERA
========================================================= */

.viewport{
    position:absolute;
    inset:0;

    transform-origin:center center;
    will-change:transform;

    transition:transform 0.5s ease-in-out;
}

/* =========================================================
   IMAGE
========================================================= */

.main-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;
    display:block;
}

/* =========================================================
   ENTER BUTTON
========================================================= */

.continue-hitbox{
    position:absolute;

    top:78%;
    left:50%;

    transform:translate(-50%, -50%);

    width:clamp(60px, 6vw, 140px);
    height:clamp(60px, 6vw, 140px);

    z-index:10;

    opacity:0;
    pointer-events:none;

    transition:opacity .5s ease;

    cursor:not-allowed;

    background:transparent;
    border:none;

    -webkit-tap-highlight-color:transparent;
}

.continue-hitbox.enabled{
    opacity:1;
    pointer-events:auto;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="bg-blur"></div>

<div class="container">

    <div class="viewport" id="camera">

        <img
            class="main-image"
            src="Images/A LANDING CONT.../Landing.png"
            alt="Landing Page"
        >

        <a
            href="ArkadianArt.html"
            class="continue-hitbox"
            id="enterButton">
        </a>

    </div>

</div>

<script>

/* =========================================================
   CAMERA POSITIONS
========================================================= */

const root = getComputedStyle(document.documentElement);

const frame1 = {
    scale: parseFloat(root.getPropertyValue('--f1-scale')),
    x: root.getPropertyValue('--f1-x').trim(),
    y: root.getPropertyValue('--f1-y').trim()
};

const frame2 = {
    scale: parseFloat(root.getPropertyValue('--f2-scale')),
    x: root.getPropertyValue('--f2-x').trim(),
    y: root.getPropertyValue('--f2-y').trim()
};

const frame3 = {
    scale: parseFloat(root.getPropertyValue('--f3-scale')),
    x: root.getPropertyValue('--f3-x').trim(),
    y: root.getPropertyValue('--f3-y').trim()
};

const camera = document.getElementById("camera");
const enterButton = document.getElementById("enterButton");

/* =========================================================
   CAMERA MOVE FUNCTION
========================================================= */

function moveCamera(frame){

    camera.style.transform =
        `translate(${frame.x}, ${frame.y}) scale(${frame.scale})`;

}

/* =========================================================
   CLIENT TIMELINE
========================================================= */

/* Start on Frame 1 */
moveCamera(frame1);

/* Hold Frame 1 for 1 second */
setTimeout(() => {

    /* Zoom to Frame 2 (0.5s transition) */
    moveCamera(frame2);

}, 1000);

/* Hold Frame 2 for 4 seconds */
setTimeout(() => {

    /* Zoom to Frame 3 (0.5s transition) */
    moveCamera(frame3);

}, 5500);

/* Stay on Frame 3 forever and enable Enter */
setTimeout(() => {

    enterButton.classList.add("enabled");

}, 6000);

</script>

</body>
</html>
