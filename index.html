<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>Arkadian Art</title>

<style>

/* =========================================================
   GLOBAL SETTINGS
========================================================= */

:root{
    --transition-speed: 0.5s;

    --hold-1: 2000;
    --hold-2: 3000;

    --f1-scale: 1;
    --f1-x: 0px;
    --f1-y: 0px;

    --f2-scale: 2;
    --f2-x: 0px;
    --f2-y: 400px;

    --f3-scale: 4.5;
    --f3-x: 25px;
    --f3-y: -1450px;

    /* =====================================================
       📱 iPHONE / MOBILE OVERRIDES (EDIT THESE)
       ===================================================== */

    --mobile-scale-offset: 2;      /* FIXES ZOOM OUT */
    --mobile-camera-x: 25px;           /* shift whole world */
    --mobile-camera-y: 0px;
    --mobile-scale-mult: 3;         /* extra tweak if needed */
}

/* =========================================================
   RESET
========================================================= */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial, Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
}

/* =========================================================
   STAGE
========================================================= */

.stage{
    position:fixed;
    top:50%;
    left:50%;
    width:1920px;
    height:1080px;
    transform-origin:center center;
    will-change:transform;
}

.stage-wrapper{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:black;
}

/* =========================================================
   BACKGROUND
========================================================= */

.bg-blur{
    position:absolute;
    inset:0;

    background-image:url("Images/A LANDING CONT.../Landing.png");
    background-size:cover;
    background-position:center;

    filter:blur(40px);
    transform:scale(1.2);
    z-index:-1;
}

/* =========================================================
   CAMERA
========================================================= */

.viewport{
    position:absolute;
    inset:0;

    transform-origin:center center;
    will-change:transform;

    transition:transform var(--transition-speed) ease-in-out;
}

/* =========================================================
   IMAGE
========================================================= */

.main-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* =========================================================
   BUTTON
========================================================= */

.continue-hitbox{
    position:absolute;
    top:78%;
    left:50%;
    transform:translate(-50%, -50%);

    width:120px;
    height:120px;

    z-index:10;

    opacity:0;
    pointer-events:none;

    transition:opacity .5s ease;

    cursor:pointer;

    background:transparent;
    border:none;

    -webkit-tap-highlight-color:transparent;
}

.continue-hitbox.enabled{
    opacity:1;
    pointer-events:auto;
}

/* =========================================================
   FIX IOS
========================================================= */

*{
    -webkit-tap-highlight-color: transparent;
}

</style>
</head>

<body>

<div class="stage-wrapper">

    <div class="stage" id="stage">

        <div class="bg-blur"></div>

        <div class="viewport" id="camera">

            <img
                class="main-image"
                src="Images/A LANDING CONT.../Landing.png"
                alt="Landing Page"
            >

            <a href="ArkadianArt.html"
               class="continue-hitbox"
               id="enterButton">
            </a>

        </div>

    </div>

</div>

<script>

/* =========================================================
   CAMERA POSITIONS
========================================================= */

const root = getComputedStyle(document.documentElement);

const transitionSpeed = parseFloat(root.getPropertyValue('--transition-speed')) * 1000;

const hold1 = parseFloat(root.getPropertyValue('--hold-1'));
const hold2 = parseFloat(root.getPropertyValue('--hold-2'));

const frame1 = {
    scale: parseFloat(root.getPropertyValue('--f1-scale')),
    x: root.getPropertyValue('--f1-x').trim(),
    y: root.getPropertyValue('--f1-y').trim()
};

const frame2 = {
    scale: parseFloat(root.getPropertyValue('--f2-scale')),
    x: root.getPropertyValue('--f2-x').trim(),
    y: root.getPropertyValue('--f2-y').trim()
};

const frame3 = {
    scale: parseFloat(root.getPropertyValue('--f3-scale')),
    x: root.getPropertyValue('--f3-x').trim(),
    y: root.getPropertyValue('--f3-y').trim()
};

const camera = document.getElementById("camera");
const enterButton = document.getElementById("enterButton");
const stage = document.getElementById("stage");

/* =========================================================
   DEVICE DETECTION
========================================================= */

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

/* =========================================================
   SCALE SYSTEM (NOW WITH MANUAL CONTROL)
========================================================= */

function updateStageScale(){

    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

    let scale = vh / 1080;

    const maxScale = vw / 1920;
    scale = Math.min(scale, maxScale);

    if (isMobile) {
        const mobileBoost = parseFloat(getComputedStyle(document.documentElement)
            .getPropertyValue('--mobile-scale-offset'));

        const mobileMult = parseFloat(getComputedStyle(document.documentElement)
            .getPropertyValue('--mobile-scale-mult'));

        scale *= mobileBoost * mobileMult;
    }

    const mobileX = isMobile
        ? getComputedStyle(document.documentElement).getPropertyValue('--mobile-camera-x')
        : "0px";

    const mobileY = isMobile
        ? getComputedStyle(document.documentElement).getPropertyValue('--mobile-camera-y')
        : "0px";

    stage.style.transform =
        `translate(calc(-50% + ${mobileX}), calc(-50% + ${mobileY})) scale(${scale})`;
}

window.addEventListener("resize", updateStageScale);
window.addEventListener("orientationchange", updateStageScale);

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", updateStageScale);
}

updateStageScale();

/* =========================================================
   CAMERA
========================================================= */

function moveCamera(frame){
    camera.style.transform =
        `translate(${frame.x}, ${frame.y}) scale(${frame.scale})`;
}

/* =========================================================
   TIMELINE
========================================================= */

moveCamera(frame1);

setTimeout(() => moveCamera(frame2), hold1);
setTimeout(() => moveCamera(frame3), hold1 + hold2);
setTimeout(() => enterButton.classList.add("enabled"), hold1 + hold2 + transitionSpeed);

</script>

</body>
</html>
