<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>Arkadian Art</title>

<style>

/* =========================================================
   GLOBAL SETTINGS
========================================================= */

:root{
    --transition-speed: 0.7s;

    --hold-0: 1000;
    --hold-1: 4000;
    --hold-2: 1000;

    --f1-scale: 1;
    --f1-x: 0px;
    --f1-y: 0px;

    --f2-scale: 2.5;
    --f2-x: 0px;
    --f2-y: 450px;

    --f3-scale: 5;
    --f3-x: 25px;
    --f3-y: -1600px;

    --f4-scale: 1;
    --f4-x: 0px;
    --f4-y: 0px;

    --mobile-f1-scale: 2;
    --mobile-f1-x: 0px;
    --mobile-f1-y: 0px;

    --mobile-f2-scale: 3;
    --mobile-f2-x: -25px;
    --mobile-f2-y: 450px;

    --mobile-f3-scale: 5.2;
    --mobile-f3-x: 70px;
    --mobile-f3-y: -1600px;

    --mobile-f4-scale: 2;
    --mobile-f4-x: 0px;
    --mobile-f4-y: 0px;

    --mobile-scale-offset: 1.5;
    --mobile-camera-x: 0px;
    --mobile-camera-y: 0px;
}

/* =========================================================
   RESET
========================================================= */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
    background:black;
}

/* =========================================================
   STAGE
========================================================= */

.stage{
    position:fixed;
    top:50%;
    left:50%;
    width:1920px;
    height:1080px;
    transform-origin:center center;
    will-change:transform;
}

.stage-wrapper{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.bg-blur{
    position:absolute;
    inset:0;
    background-image:url("Images/A LANDING CONT.../Landing.png");
    background-size:cover;
    background-position:center;
    transform:scale(1.4);
    filter:blur(70px) brightness(0.7);
    z-index:-1;
}

.bg-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
    z-index:-1;
}

/* =========================================================
   CAMERA
========================================================= */

.viewport{
    position:absolute;
    inset:0;
    transform-origin:center center;
    will-change:transform;
    transition:transform var(--transition-speed) ease-in-out;
}

/* =========================================================
   IMAGE
========================================================= */

.main-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* =========================================================
   BUTTON
========================================================= */

.continue-hitbox{
    position:absolute;
    top:78%;
    left:50%;
    transform:translate(-50%, -50%);
    width:120px;
    height:120px;
    z-index:10;

    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;

    background:transparent;
    border:none;
    -webkit-tap-highlight-color:transparent;
}

.continue-hitbox.enabled{
    opacity:1;
    pointer-events:auto;
}

</style>
</head>

<body>

<div class="stage-wrapper">
    <div class="stage" id="stage">

        <div class="bg-blur"></div>
        <div class="bg-overlay"></div>

        <div class="viewport" id="camera">

            <img class="main-image"
                 src="Images/A LANDING CONT.../Landing.png"
                 alt="Landing Page">

            <a href="ArkadianArt.html"
               class="continue-hitbox"
               id="enterButton"></a>

        </div>
    </div>
</div>

<script>

/* =========================================================
   SETUP
========================================================= */

const root = getComputedStyle(document.documentElement);

const transitionSpeed = parseFloat(root.getPropertyValue('--transition-speed')) * 1000;

const hold0 = parseFloat(root.getPropertyValue('--hold-0'));
const hold1 = parseFloat(root.getPropertyValue('--hold-1'));
const hold2 = parseFloat(root.getPropertyValue('--hold-2'));

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const camera = document.getElementById("camera");
const enterButton = document.getElementById("enterButton");
const stage = document.getElementById("stage");

function getVar(name){
    return root.getPropertyValue(name).trim();
}

/* =========================================================
   CAMERA MOVE
========================================================= */

function moveCamera(frame){
    const prefix = isMobile ? '--mobile-f' : '--f';

    const scale = parseFloat(getVar(`${prefix}${frame}-scale`));
    const x = getVar(`${prefix}${frame}-x`);
    const y = getVar(`${prefix}${frame}-y`);

    camera.style.transform = `translate(${x}, ${y}) scale(${scale})`;
}

/* =========================================================
   STAGE SCALE
========================================================= */

function updateStageScale(){
    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

    let scale = Math.min(vw / 1920, vh / 1080);

    if(isMobile){
        scale *= parseFloat(getVar('--mobile-scale-offset') || 1);
    }

    const mx = isMobile ? getVar('--mobile-camera-x') : "0px";
    const my = isMobile ? getVar('--mobile-camera-y') : "0px";

    stage.style.transform =
        `translate(calc(-50% + ${mx}), calc(-50% + ${my})) scale(${scale})`;
}

window.addEventListener("resize", updateStageScale);
window.addEventListener("orientationchange", updateStageScale);

if(window.visualViewport){
    window.visualViewport.addEventListener("resize", updateStageScale);
}

/* =========================================================
   🔥 CRITICAL FIX: LOCK INITIAL RENDER
========================================================= */

updateStageScale();

/* force browser to settle layout BEFORE first frame */
requestAnimationFrame(() => {

    camera.style.transition = "none";

    const prefix = isMobile ? '--mobile-f' : '--f';

    camera.style.transform =
        `translate(${getVar(`${prefix}1-x`)}, ${getVar(`${prefix}1-y`)}) scale(${getVar(`${prefix}1-scale`)})`;

    camera.getBoundingClientRect(); // force paint

    camera.style.transition = `transform ${transitionSpeed}ms ease-in-out`;

    /* TIMELINE */
    setTimeout(() => moveCamera(2), hold0);
    setTimeout(() => moveCamera(3), hold0 + hold1);
    setTimeout(() => moveCamera(4), hold0 + hold1 + hold2);

    setTimeout(() => {
        enterButton.classList.add("enabled");
    }, hold0 + hold1 + hold2 + transitionSpeed);
});

</script>

</body>
</html>
